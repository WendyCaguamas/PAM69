<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web con Fondo 3D desde Blender</title>
    <style>
        /* Reseteo básico de márgenes */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
            background-color: #0b0b0f; /* Fondo oscuro mientras carga el 3D */
        }

        /* Contenedor fijo que ocupa toda la pantalla por detrás */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1; 
        }

        /* Capa de contenido HTML (Texto, menús, etc.) */
        .content {
            position: relative;
            z-index: 1; 
            padding: 50px;
            max-width: 600px;
            pointer-events: none; /* Permite interactuar con el 3D de fondo */
        }

        /* Elementos interactivos */
        .interactive {
            pointer-events: auto;
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 10px 20px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <!-- El lienzo 3D se dibujará aquí dentro -->
    <div id="canvas-container"></div>

    <!-- Tu contenido web normal -->
    <div class="content">
        <h1>Mi Sitio Web 3D</h1>
        <p>Tu modelo "logo.glb" se está cargando de fondo sin luces desde GitHub Pages.</p>
        <button class="interactive">Botón Interactivo</button>
    </div>

    <!-- Usamos un script modular directo sin depender de importmaps complejos -->
    <script type="module">
        // Importación directa desde la red CDN oficial de cdnjs (Cloudflare CDN)
        import * as THREE from 'https://cloudflare.com';
        import { GLTFLoader } from 'https://jsdelivr.net';

        // 1. Configuración de la Escena, Cámara y Renderizador
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Sin luces para lograr el acabado "flat/material preview" que deseas

        // 2. Cargar el modelo .glb usando rutas relativas explícitas para GitHub
        const loader = new GLTFLoader();
        let miModelo = null;

        loader.load('./modelo/logo.glb', (gltf) => {
            miModelo = gltf.scene;
            
            // Forzar materiales básicos planos que ignoren la iluminación web
            miModelo.traverse((child) => {
                if (child.isMesh && child.material) {
                    const oldMat = child.material;
                    child.material = new THREE.MeshBasicMaterial({
                        map: oldMat.map,         
                        color: oldMat.color,     
                        side: THREE.DoubleSide   
                    });
                }
            });

            miModelo.position.set(0, 0, 0);
            scene.add(miModelo);
            console.log("Modelo 3D cargado correctamente.");
            
        }, undefined, (error) => {
            console.error('Error al intentar cargar logo.glb:', error);
        });

        // Posición de la cámara en el espacio
        camera.position.set(0, 1, 8);
        camera.lookAt(0, 0, 0);

        // 3. Animación de rotación continua
        function animate() {
            requestAnimationFrame(animate);
            if (miModelo) {
                miModelo.rotation.y += 0.003; 
            }
            renderer.render(scene, camera);
        }
        animate();

        // 4. Adaptar el diseño si se cambia el tamaño de la ventana
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
